; Adoption check: the upstream F Prime `Ref` deployment built against the FprimeQnx platform library.
; Ref/ is generated by scripts/import-ref.sh from lib/fprime (pinned) plus ref-qnx.patch.
; Build: source <sdp>/qnxsdp-env.sh && fprime-util generate qnx-x86_64 && fprime-util build qnx-x86_64
[fprime]
project_root: .
framework_path: ../lib/fprime
library_locations: ../FprimeQnx
default_cmake_options: FPRIME_ENABLE_FRAMEWORK_UTS=OFF
    FPRIME_ENABLE_AUTOCODER_UTS=OFF
