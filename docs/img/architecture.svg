
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title description">
  <title id="title">F Prime on QNX runtime</title>
  <desc id="description">On QNX, FlightSW uses a pulse-driven rate group and a recovery gate. Bounded queues connect that work to a native IPC worker, which exchanges snapshots and advice with a separate MlAdvisor process managed by SLM. A logger and ground services connect FlightSW to GDS on the host.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#385773"/>
    </marker>
  </defs>
  <rect width="960" height="410" rx="18" fill="#f7faff"/>
  <rect x="20" y="20" width="711" height="370" rx="14" fill="#eaf2fc" stroke="#a3b8d1" stroke-width="1.5"/>
  <rect x="782" y="20" width="158" height="370" rx="14" fill="#f1f4f8" stroke="#bac8d9" stroke-width="1.5"/>
  <g font-family="system-ui, sans-serif" fill="#172e46">
    <g font-size="20" font-weight="700">
      <text x="42" y="53">QNX x86-64 guest</text>
      <text x="799" y="53">Linux host</text>
    </g>
    <rect x="42" y="72" width="452" height="296" rx="12" fill="#fff" stroke="#5980aa" stroke-width="2"/>
    <rect x="571" y="72" width="136" height="55" rx="9" fill="#fff" stroke="#5980aa" stroke-width="1.5"/>
    <rect x="571" y="162" width="136" height="101" rx="9" fill="#e7f4ee" stroke="#3b8164" stroke-width="2"/>
    <rect x="802" y="296" width="117" height="54" rx="9" fill="#fff" stroke="#5980aa" stroke-width="1.5"/>
    <g font-size="18" font-weight="700">
      <text x="62" y="102">FlightSW</text>
      <text x="639" y="95" text-anchor="middle">SLM</text>
      <text x="639" y="193" text-anchor="middle">MlAdvisor</text>
      <text x="860" y="330" text-anchor="middle">F Prime GDS</text>
    </g>
    <g fill="#eaf2fc" stroke="#aec6e0" stroke-width="1.5">
      <rect x="62" y="120" width="410" height="59" rx="8"/>
      <rect x="62" y="204" width="230" height="55" rx="8"/>
      <rect x="332" y="204" width="140" height="55" rx="8"/>
      <rect x="62" y="296" width="410" height="54" rx="8"/>
    </g>
    <g font-size="15" font-weight="650">
      <text x="80" y="144">QnxTimer pulses and flight rate group</text>
      <text x="80" y="165" font-weight="400">Sun estimate, RecoveryGate and FDIR</text>
      <text x="177" y="238" text-anchor="middle">Bounded handoff</text>
      <text x="402" y="238" text-anchor="middle">IPC worker</text>
      <text x="80" y="329">Logger and ground services</text>
    </g>
    <g font-size="13" fill="#284662">
      <text x="639" y="114" text-anchor="middle">Supervisor</text>
      <text x="639" y="216" text-anchor="middle">Snapshot scoring</text>
      <text x="639" y="237" text-anchor="middle">and advice</text>
      <text x="522" y="217" text-anchor="middle">QNX IPC</text>
      <text x="650" y="311" text-anchor="middle">Commands, events and telemetry</text>
    </g>
  </g>
  <g stroke="#385773" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M 639 127 V 161"/>
    <path d="M 270 179 V 203" marker-start="url(#arrow)"/>
    <path d="M 293 231 H 331" marker-start="url(#arrow)"/>
    <path d="M 473 231 H 570" marker-start="url(#arrow)"/>
    <path d="M 472 323 H 801" marker-start="url(#arrow)"/>
    <path d="M 62 162 H 51 V 323 H 61"/>
  </g>
</svg>
